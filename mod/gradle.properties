# Build matrix: override any of these with -P<name>=<value>
#   ./gradlew build -Pminecraft_version=26.2 -Pfabric_api_version=0.161.0+26.2 \
#                   -Pminecraft_dependency='~26.2' -Pjava_dependency='>=25'
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

mod_version=1.0.0
maven_group=dev.mcmcp
archives_base_name=mcmcp

# Default target. 26.x uses Mojang-named (unobfuscated) classes.
minecraft_version=26.1.2
loader_version=0.20.1
fabric_api_version=0.155.3+26.1.2

minecraft_dependency=~26.1
java_dependency=>=25
java_version=25
