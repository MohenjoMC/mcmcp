plugins {
    // 26.x ships unobfuscated (no remapping); 1.21.x needs the remapping plugin and mappings.
    id 'net.fabricmc.fabric-loom' version '1.19-SNAPSHOT' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.19-SNAPSHOT' apply false
    id 'maven-publish'
    id 'java'
}

def mcVersion = project.minecraft_version
def modern = mcVersion.startsWith('26.')
def javaVersion = (project.findProperty('java_version') ?: (modern ? '25' : '21')).toString().toInteger()

// The API family decides which compat implementation and mixins get compiled.
def family = project.findProperty('compat_family') ?: (modern ? '26' : '12111')

if (modern) {
    apply plugin: 'net.fabricmc.fabric-loom'
} else {
    apply plugin: 'net.fabricmc.fabric-loom-remap'
}

version = "${project.mod_version}+${mcVersion}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    if (modern) {
        // Unobfuscated: plain configurations, no mappings, no remapping.
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    } else {
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    }
}

sourceSets {
    main {
        java {
            srcDir "src/versions/${family}/java"
        }
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_dependency', project.minecraft_dependency
    inputs.property 'java_dependency', project.java_dependency

    filesMatching('fabric.mod.json') {
        expand version: project.version,
               minecraft_dependency: project.minecraft_dependency,
               java_dependency: project.java_dependency
    }
}

java {
    withSourcesJar()
}

// One JVM (25) builds every target; --release keeps the bytecode valid for 1.21.x.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaVersion
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
